
services:
  - type: web
    name: openjarvis-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENJARVIS_API_KEY
        generateValue: true
      - key: FREELLMAPI_BASE_URL
        value: https://freellmapi-sjjq.onrender.com
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: JARVIS_MODEL
        value: auto
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
